name: Bug report
description: 报告一个可以复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢帮忙修山。请尽量给出可复现的步骤；如果问题只在手机上出现，请写明机型和浏览器。

  - type: input
    id: device
    attributes:
      label: 设备 / 浏览器
      description: 例如 iPhone 15 / Safari 18，或 华为 Mate 60 / 自带浏览器
      placeholder: iPhone 15, Safari 18
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: 页面地址
      description: 线上或本地地址
      placeholder: https://kongshan.291540038.workers.dev/
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从进山开始，一步一步写
      placeholder: |
        1. 进入山门
        2. 走到大殿蒲团前按 E
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望发生什么

  - type: textarea
    id: actual
    attributes:
      label: 实际发生了什么

  - type: textarea
    id: console
    attributes:
      label: 控制台错误 / 录屏
      description: 浏览器开发者工具里的红色错误，或一段录屏链接
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已经尝试刷新并确认不是旧缓存
          required: true
        - label: 这不是一个安全问题（安全问题请走 SECURITY.md 的私密渠道）
          required: true
